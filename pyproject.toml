[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-doctor"
version = "0.1.0"
description = "One read-only, privacy-minimized support report for Codex, Claude Code, and Gemini CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tomdachs" }]
keywords = ["coding-agent", "codex", "claude-code", "gemini-cli", "diagnostics", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Tomdachs/agent-runtime-doctor"
Repository = "https://github.com/Tomdachs/agent-runtime-doctor"
Issues = "https://github.com/Tomdachs/agent-runtime-doctor/issues"

[project.scripts]
agent-runtime-doctor = "agent_runtime_doctor.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25,<5",
    "pytest>=8.4,<10",
    "ruff>=0.13,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime_doctor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
