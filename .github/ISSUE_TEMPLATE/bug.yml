name: Bug report
description: Report incorrect diagnostics, crashes, or portability problems
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets or raw provider diagnostic output. Prefer Agent Runtime Doctor's privacy-minimized Markdown/JSON report and review it before posting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands or steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Privacy-minimized report
      description: Output from `agent-runtime-doctor report --format markdown`, after you review it.
      render: markdown
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the report and removed anything I do not want public.
          required: true
